name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a v prefix
        required: true
        type: string
      build_number:
        description: Positive macOS bundle build number
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Verify immutable release source and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          test "$GITHUB_REF" = "refs/tags/v${version}"
          resolved=$(cargo metadata --format-version=1 --no-deps | python3 -c \
            'import json,sys; data=json.load(sys.stdin); print(next(p["version"] for p in data["packages"] if p["name"] == "agent-remote-device-proxy"))')
          test "$resolved" = "$version"
      - name: Generate release vulnerability reports
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo audit --json > "agent-remote-device-${VERSION}.cargo-audit.json"
          scripts/audit-swift-dependencies.sh Package.resolved \
            "agent-remote-device-${VERSION}.swift-osv.json"
          sha256sum "agent-remote-device-${VERSION}.cargo-audit.json" \
            > "agent-remote-device-${VERSION}.cargo-audit.json.sha256"
          sha256sum "agent-remote-device-${VERSION}.swift-osv.json" \
            > "agent-remote-device-${VERSION}.swift-osv.json.sha256"
          for report in \
            "agent-remote-device-${VERSION}.cargo-audit.json" \
            "agent-remote-device-${VERSION}.swift-osv.json"; do
            cosign sign-blob --yes --bundle "$report.sigstore.json" "$report"
            cosign verify-blob \
              --bundle "$report.sigstore.json" \
              --certificate-identity \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/prepare-release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$report"
          done
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: agent-remote-device-vulnerability-reports-${{ inputs.version }}
          if-no-files-found: error
          path: |
            agent-remote-device-${{ inputs.version }}.cargo-audit.json
            agent-remote-device-${{ inputs.version }}.cargo-audit.json.sha256
            agent-remote-device-${{ inputs.version }}.cargo-audit.json.sigstore.json
            agent-remote-device-${{ inputs.version }}.swift-osv.json
            agent-remote-device-${{ inputs.version }}.swift-osv.json.sha256
            agent-remote-device-${{ inputs.version }}.swift-osv.json.sigstore.json

  proxy:
    name: proxy (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            label: linux-amd64-glibc
          - target: aarch64-unknown-linux-gnu
            label: linux-arm64-glibc
          - target: x86_64-unknown-linux-musl
            label: linux-amd64-musl
          - target: aarch64-unknown-linux-musl
            label: linux-arm64-musl
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned cross builder
        run: cargo install cross --locked --version 0.2.5
      - name: Build proxy release
        env:
          BUILD_TOOL: cross
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: scripts/package-proxy-release.sh
      - name: Create proxy archive
        env:
          LABEL: ${{ matrix.label }}
          VERSION: ${{ inputs.version }}
        run: |
          archive="agent-remote-device-proxy-${LABEL}-${VERSION}.tar.gz"
          tar -C "dist/device-proxies/${LABEL}" -czf "$archive" \
            agent-remote-device-proxy VERSION SHA256SUMS
          sha256sum "$archive" > "$archive.sha256"
      - name: Generate proxy SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/device-proxies/${{ matrix.label }}
          format: spdx-json
          output-file: agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.spdx.json
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign proxy update archive and SBOM
        env:
          LABEL: ${{ matrix.label }}
          VERSION: ${{ inputs.version }}
        run: |
          archive="agent-remote-device-proxy-${LABEL}-${VERSION}.tar.gz"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          sbom="agent-remote-device-proxy-${LABEL}-${VERSION}.spdx.json"
          cosign sign-blob --yes --bundle "$sbom.sigstore.json" "$sbom"
      - name: Attest proxy archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.tar.gz
      - name: Verify proxy release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ inputs.version }}
        run: |
          archive="agent-remote-device-proxy-${LABEL}-${VERSION}.tar.gz"
          sha256sum --check "$archive.sha256"
          jq -e '.spdxVersion | startswith("SPDX-")' \
            "agent-remote-device-proxy-${LABEL}-${VERSION}.spdx.json" >/dev/null
          sbom="agent-remote-device-proxy-${LABEL}-${VERSION}.spdx.json"
          cosign verify-blob \
            --bundle "$sbom.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/prepare-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$sbom"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/prepare-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}
          if-no-files-found: error
          path: |
            agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.tar.gz
            agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.tar.gz.sha256
            agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.tar.gz.sigstore.json
            agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.spdx.json
            agent-remote-device-proxy-${{ matrix.label }}-${{ inputs.version }}.spdx.json.sigstore.json

  macos:
    name: signed and notarized macOS application
    runs-on: macos-15
    needs: validate
    environment: production-device-release
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/developer-id.p12"
          keychain="$RUNNER_TEMP/agent-remote-build.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
      - name: Build hardened signed application
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          TEAM_IDENTIFIER: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
          OUTBOUND_POLICY_ATTESTOR_MACH_SERVICE: ${{ vars.OUTBOUND_POLICY_ATTESTOR_MACH_SERVICE }}
          OUTBOUND_POLICY_ATTESTOR_PUBLIC_KEY_BASE64: ${{ secrets.OUTBOUND_POLICY_ATTESTOR_PUBLIC_KEY_BASE64 }}
          OUTBOUND_POLICY_IDENTIFIER: ${{ vars.OUTBOUND_POLICY_IDENTIFIER }}
        run: scripts/build-release-app.sh
      - name: Submit application for notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          submission="$RUNNER_TEMP/agent-remote-device-notary.zip"
          ditto -c -k --keepParent "dist/release/Agent Remote Device.app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json > "dist/release/notarization-${VERSION}.json"
          xcrun stapler staple "dist/release/Agent Remote Device.app"
          xcrun stapler validate "dist/release/Agent Remote Device.app"
          spctl --assess --type execute --verbose=2 "dist/release/Agent Remote Device.app"
      - name: Create notarized application archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          archive="agent-remote-device-macos-${VERSION}.zip"
          ditto -c -k --keepParent "dist/release/Agent Remote Device.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Generate application SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/release/Agent Remote Device.app
          format: spdx-json
          output-file: agent-remote-device-macos-${{ inputs.version }}.spdx.json
      - uses: sigstore/cosign-installer@v4.0.0
      - name: Sign notarized application update archive and SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          archive="agent-remote-device-macos-${VERSION}.zip"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          sbom="agent-remote-device-macos-${VERSION}.spdx.json"
          cosign sign-blob --yes --bundle "$sbom.sigstore.json" "$sbom"
      - name: Attest application archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: agent-remote-device-macos-${{ inputs.version }}.zip
      - name: Verify macOS release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          archive="agent-remote-device-macos-${VERSION}.zip"
          shasum -a 256 --check "$archive.sha256"
          jq -e '.spdxVersion | startswith("SPDX-")' \
            "agent-remote-device-macos-${VERSION}.spdx.json" >/dev/null
          sbom="agent-remote-device-macos-${VERSION}.spdx.json"
          cosign verify-blob \
            --bundle "$sbom.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/prepare-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$sbom"
          jq -e '.status == "Accepted"' "dist/release/notarization-${VERSION}.json" >/dev/null
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/prepare-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"
      - name: Create and sign application signing and notarization evidence
        env:
          TEAM_IDENTIFIER: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="agent-remote-device-macos-${VERSION}.zip"
          evidence="agent-remote-device-macos-${VERSION}.signing-notarization.json"
          application_sha256=$(shasum -a 256 "$archive" | awk '{print $1}')
          notarization_id=$(jq -er '.id' "dist/release/notarization-${VERSION}.json")
          broker_plist="dist/release/Agent Remote Device.app/Contents/XPCServices/AgentRemoteNetworkBroker.xpc/Contents/Info.plist"
          broker_bundle_identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$broker_plist")
          broker_team_identifier=$(/usr/libexec/PlistBuddy -c 'Print :AgentRemoteTeamIdentifier' "$broker_plist")
          signed_team_identifier=$(codesign --display --verbose=4 "dist/release/Agent Remote Device.app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          outbound_policy_identifier=$(/usr/libexec/PlistBuddy -c 'Print :AgentRemoteOutboundPolicyIdentifier' "$broker_plist")
          attestor_mach_service=$(/usr/libexec/PlistBuddy -c 'Print :AgentRemoteOutboundPolicyAttestorMachService' "$broker_plist")
          attestor_public_key=$(/usr/libexec/PlistBuddy -c 'Print :AgentRemoteOutboundPolicyAttestorPublicKey' "$broker_plist")
          attestor_public_key_sha256=$(printf '%s' "$attestor_public_key" | /usr/bin/base64 -D | shasum -a 256 | awk '{print $1}')
          test "$broker_bundle_identifier" = "dev.agentremote.device.network-broker"
          test "$broker_team_identifier" = "$TEAM_IDENTIFIER"
          test "$signed_team_identifier" = "$TEAM_IDENTIFIER"
          jq -n \
            --arg application_sha256 "$application_sha256" \
            --arg attestor_mach_service "$attestor_mach_service" \
            --arg attestor_public_key_sha256 "$attestor_public_key_sha256" \
            --arg broker_bundle_identifier "$broker_bundle_identifier" \
            --arg notarization_submission_id "$notarization_id" \
            --arg outbound_policy_identifier "$outbound_policy_identifier" \
            --arg team_identifier "$signed_team_identifier" \
            --arg version "$VERSION" \
            '{schema_version:1,release_version:$version,status:"passed",application_sha256:$application_sha256,team_identifier:$team_identifier,bundle_identifier:"dev.agentremote.device",broker_bundle_identifier:$broker_bundle_identifier,outbound_policy_identifier:$outbound_policy_identifier,attestor_mach_service:$attestor_mach_service,attestor_public_key_sha256:$attestor_public_key_sha256,notarization_submission_id:$notarization_submission_id,notarization_status:"Accepted",artifact_signature_verified:true,hardened_runtime:true,stapler_validated:true,gatekeeper_assessed:true}' \
            > "$evidence"
          shasum -a 256 "$evidence" > "$evidence.sha256"
          cosign sign-blob --yes --bundle "$evidence.sigstore.json" "$evidence"
          cosign verify-blob \
            --bundle "$evidence.sigstore.json" \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/prepare-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$evidence"
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: agent-remote-device-macos-${{ inputs.version }}
          if-no-files-found: error
          path: |
            agent-remote-device-macos-${{ inputs.version }}.zip
            agent-remote-device-macos-${{ inputs.version }}.zip.sha256
            agent-remote-device-macos-${{ inputs.version }}.zip.sigstore.json
            agent-remote-device-macos-${{ inputs.version }}.spdx.json
            agent-remote-device-macos-${{ inputs.version }}.spdx.json.sigstore.json
            agent-remote-device-macos-${{ inputs.version }}.signing-notarization.json
            agent-remote-device-macos-${{ inputs.version }}.signing-notarization.json.sha256
            agent-remote-device-macos-${{ inputs.version }}.signing-notarization.json.sigstore.json
            dist/release/notarization-${{ inputs.version }}.json

  publish:
    runs-on: ubuntu-latest
    needs: [proxy, macos]
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts
      - uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: v${{ inputs.version }}
          name: agent-remote-device v${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
