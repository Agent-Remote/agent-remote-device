name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a v prefix
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Normalize version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid semantic version: $INPUT_VERSION" >&2
            exit 2
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "tag v${version} already exists" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
      - name: Prepare release files
        run: scripts/prepare-release.sh "${{ steps.version.outputs.value }}"
      - name: Verify prepared source
        run: |
          cargo check --workspace --locked
          swift build
          bash tests/release_scripts_test.sh
          ruby tests/release_workflow_contract_test.rb
          git diff --check
      - name: Commit, tag, and start protected release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock fuzz/Cargo.lock README.md README.zh-CN.md \
            CHANGELOG.md scripts/prepare-release.sh
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v${VERSION}"
          fi
          git diff --exit-code
          git tag "v${VERSION}"
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "v${VERSION}"
          gh workflow run release.yml --ref "v${VERSION}" -f version="${VERSION}" -f build_number="${GITHUB_RUN_NUMBER}"
